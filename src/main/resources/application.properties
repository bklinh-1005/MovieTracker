spring.application.name=movie-tracker
server.port=8080

# 1. Ket noi MySQL (Tu dong tao database movie_tracker neu chua co)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Tu dong tao bang trong MySQL tu code Java (Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Cau hinh giao dien Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# 4. Cau hinh TMDB API
tmdb.api.key=${TMDB_API_KEY:YOUR_TMDB_API_KEY_HERE}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.image.base-url=https://image.tmdb.org/t/p/w500