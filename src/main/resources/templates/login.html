<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Movie Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; }
        .auth-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; max-width: 420px; width: 100%; }
        .form-control { background-color: #0f172a; border-color: #334155; color: #fff; }
        .form-control:focus { background-color: #0f172a; color: #fff; border-color: #e50914; box-shadow: none; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="auth-card p-4 shadow-lg">
        <h3 class="fw-bold text-center text-danger mb-1">🎬 MOVIE TRACKER</h3>
        <p class="text-center text-secondary small mb-4">Đăng nhập để quản lý tủ phim của bạn</p>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">Sai tên đăng nhập hoặc mật khẩu!</div>
        <div th:if="${param.registered}" class="alert alert-success py-2 small">Đăng ký thành công! Hãy đăng nhập.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="VD: khanhlinh hoặc admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Mặc định: 123456" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-semibold py-2">Đăng Nhập</button>
        </form>

        <div class="text-center mt-3 small">
            <span class="text-secondary">Chưa có tài khoản?</span> <a href="/register" class="text-warning fw-bold">Đăng ký ngay</a>
            <div class="mt-2"><a href="/" class="text-secondary">← Về trang chủ</a></div>
        </div>
    </div>
</div>
</body>
</html>
