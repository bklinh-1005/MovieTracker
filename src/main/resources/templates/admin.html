<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị hệ thống - Movie Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .box { background-color: #1e293b; border: 1px solid #334155; border-radius: 14px; }
        .form-control { background-color: #0f172a; border-color: #334155; color: #fff; }
        .form-control:focus { background-color: #0f172a; color: #fff; border-color: #38bdf8; box-shadow: none; }
        .form-control::placeholder { color: #64748b; }
        /* CSS cho nút Tag thể loại bấm chọn */
        .genre-tag-label {
            cursor: pointer;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.85rem;
            border: 1px solid #475569;
            color: #cbd5e1;
            background-color: #0f172a;
            transition: all 0.2s;
            user-select: none;
        }
        .btn-check:checked + .genre-tag-label {
            background-color: #e50914;
            border-color: #e50914;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }
        .thumb-poster { width: 45px; height: 65px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
<div class="container my-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-info m-0"><i class="fa-solid fa-shield-halved me-2"></i>Bảng Điều Khiển Quản Trị Viên (ADMIN)</h3>
        <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i>Về Trang Chủ</a>
    </div>

    <!-- Thông báo -->
    <div th:if="${param.saved}" class="alert alert-success py-2">
        <i class="fa-solid fa-circle-check me-2"></i>Đã lưu thông tin bộ phim thành công!
    </div>
    <div th:if="${param.deleted}" class="alert alert-warning py-2">
        <i class="fa-solid fa-trash-can me-2"></i>Đã xóa bộ phim khỏi hệ thống!
    </div>

    <div class="row g-4">
        <!-- CỘT TRÁI: Form Thêm mới / Chỉnh sửa Phim với Tag Thể loại -->
        <div class="col-lg-5">
            <div class="box p-4 sticky-top" style="top: 20px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-warning m-0">
                        <i class="fa-solid fa-pen-to-square me-2" th:if="${editMovie != null}"></i>
                        <i class="fa-solid fa-plus-circle me-2" th:if="${editMovie == null}"></i>
                        <span th:text="${editMovie != null ? 'Chỉnh Sửa Thông Tin Phim' : 'Thêm Phim Mới Vào Hệ Thống'}"></span>
                    </h5>
                    <a th:if="${editMovie != null}" href="/admin" class="btn btn-outline-secondary btn-sm">Hủy sửa</a>
                </div>

                <form th:action="@{/admin/movies/save}" method="post">
                    <!-- Ẩn ID phim nếu đang ở chế độ Sửa -->
                    <input type="hidden" name="id" th:value="${editMovie != null ? editMovie.id : ''}">

                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-1">Tên bộ phim *</label>
                        <input type="text" name="title" class="form-control" placeholder="VD: Avatar: Dòng Chảy Của Nước"
                               th:value="${editMovie != null ? editMovie.title : ''}" required>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small text-secondary mb-1">Năm phát hành *</label>
                            <input type="number" name="releaseYear" class="form-control" placeholder="VD: 2024"
                                   th:value="${editMovie != null ? editMovie.releaseYear : 2024}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-secondary mb-1">Điểm TMDB (Thang 10)</label>
                            <input type="number" step="0.1" min="0" max="10" name="voteAverage" class="form-control"
                                   th:value="${editMovie != null ? editMovie.voteAverage : 8.0}">
                        </div>
                    </div>

                    <!-- CHỌN THỂ LOẠI BẰNG TAG BẤM CHỌN -->
                    <div class="mb-3">
                        <label class="form-label small text-warning fw-semibold mb-2">
                            <i class="fa-solid fa-tags me-1"></i>Chọn các Tag thể loại (Bấm để chọn một hoặc nhiều):
                        </label>
                        <div class="d-flex flex-wrap gap-2">
                            <div th:each="g, iterStat : ${allGenres}">
                                <input type="checkbox" class="btn-check" name="genreTags"
                                       th:id="'genreTag_' + ${iterStat.index}"
                                       th:value="${g}"
                                       th:checked="${editMovie != null and editMovie.genres != null and editMovie.genres.contains(g)}">
                                <label class="genre-tag-label" th:for="'genreTag_' + ${iterStat.index}">
                                    <i class="fa-solid fa-hashtag small me-1"></i><span th:text="${g}"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small text-secondary mb-1">Đạo diễn *</label>
                            <input type="text" name="director" class="form-control" placeholder="VD: Christopher Nolan"
                                   th:value="${editMovie != null ? editMovie.director : ''}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-secondary mb-1">Mã YouTube Trailer</label>
                            <input type="text" name="trailerKey" class="form-control" placeholder="VD: YoHD9XEInc0"
                                   th:value="${editMovie != null ? editMovie.trailerKey : ''}">
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-1">Dàn diễn viên chính</label>
                        <input type="text" name="castMembers" class="form-control" placeholder="VD: Leonardo DiCaprio, Cillian Murphy..."
                               th:value="${editMovie != null ? editMovie.castMembers : ''}">
                    </div>

                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-1">Link ảnh Poster (URL)</label>
                        <input type="text" name="posterPath" class="form-control" placeholder="https://image.tmdb.org/..."
                               th:value="${editMovie != null ? editMovie.posterPath : ''}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-secondary mb-1">Mô tả nội dung phim *</label>
                        <textarea name="overview" rows="3" class="form-control" placeholder="Tóm tắt nội dung chính của bộ phim..."
                                  th:text="${editMovie != null ? editMovie.overview : ''}" required></textarea>
                    </div>

                    <button type="submit" class="btn w-100 fw-bold py-2"
                            th:classappend="${editMovie != null ? 'btn-warning text-dark' : 'btn-info text-dark'}">
                        <i class="fa-solid fa-floppy-disk me-2"></i>
                        <span th:text="${editMovie != null ? 'Lưu Cập Nhật Bộ Phim' : 'Thêm Phim Mới'}"></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- CỘT PHẢI: Danh sách Quản lý Phim (Sửa / Xóa) & Danh sách Tài khoản -->
        <div class="col-lg-7">
            <!-- Bảng Quản lý Kho Phim -->
            <div class="box p-4 mb-4">
                <h5 class="fw-bold mb-3 text-info">
                    <i class="fa-solid fa-film me-2"></i>Danh Sách Phim Trong Hệ Thống (<span th:text="${movies.size()}"></span>)
                </h5>
                <div class="table-responsive" style="max-height: 460px; overflow-y: auto;">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Poster</th>
                            <th>Thông tin phim</th>
                            <th>Tag Thể loại</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${movies}">
                            <td>
                                <img th:src="${m.posterPath}" class="thumb-poster" th:alt="${m.title}">
                            </td>
                            <td>
                                <a th:href="@{/movies/{id}(id=${m.id})}" class="fw-bold text-white text-decoration-none" th:text="${m.title}"></a>
                                <div class="small text-secondary">
                                    <span th:text="${m.releaseYear}"></span> • ĐD: <span th:text="${m.director}"></span> • ⭐ <span th:text="${m.voteAverage}"></span>
                                </div>
                            </td>
                            <td>
                                <span th:each="tag : ${#strings.arraySplit(m.genres, ',')}"
                                      class="badge bg-secondary me-1 mb-1"
                                      th:text="${#strings.trim(tag)}"></span>
                            </td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-1">
                                    <a th:href="@{/admin(editId=${m.id})}" class="btn btn-outline-warning btn-sm" title="Sửa nội dung phim">
                                        <i class="fa-solid fa-pen"></i> Sửa
                                    </a>
                                    <form th:action="@{/admin/movies/{id}/delete(id=${m.id})}" method="post" class="m-0"
                                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa bộ phim này không?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa phim">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Bảng Quản lý Tài khoản Người dùng -->
            <div class="box p-4">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-users me-2 text-warning"></i>Danh Sách Tài Khoản Người Dùng (<span th:text="${users.size()}"></span>)</h5>
                <div class="table-responsive">
                    <table class="table table-dark table-sm align-middle mb-0">
                        <thead><tr><th>ID</th><th>Username</th><th>Họ tên</th><th>Email</th><th>Quyền</th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td class="fw-semibold" th:text="${u.username}"></td>
                            <td th:text="${u.fullName}"></td>
                            <td th:text="${u.email}"></td>
                            <td><span class="badge bg-danger" th:text="${u.role}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
